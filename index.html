<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hán Tự Mỗi Ngày — học từ vựng tiếng Trung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4eee2; --card:#fffbf3; --ink:#231e18; --ink2:#6e6457; --ink3:#9a8f7f;
  --line:#e2d7c3; --red:#b3362b; --red-soft:#f6e1dc; --jade:#2c7553; --jade-soft:#dcefe4;
  --blue:#2d5c99; --blue-soft:#dde7f5; --amber:#a86b12; --amber-soft:#f6ead2;
  --shadow:0 1px 0 rgba(60,40,10,.04),0 8px 28px -12px rgba(60,40,10,.22);
  --zh:'LXGW WenKai TC','Noto Serif TC','PingFang TC','Microsoft JhengHei',serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#16130f; --card:#211c16; --ink:#f0e8d9; --ink2:#b3a792; --ink3:#857a69;
  --line:#3a3229; --red:#e4705f; --red-soft:#3d221d; --jade:#62b98b; --jade-soft:#1c3328;
  --blue:#7ea6e0; --blue-soft:#1d2a3d; --amber:#e0a84a; --amber-soft:#3a2e18;
  --shadow:0 10px 30px -14px rgba(0,0,0,.7);}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 'Be Vietnam Pro',system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(circle at 15% 0%,rgba(179,54,43,.06),transparent 40%),radial-gradient(circle at 100% 30%,rgba(44,117,83,.05),transparent 40%);}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:18px 16px 120px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.seal{width:42px;height:42px;border-radius:9px;background:var(--red);color:#fff8ef;display:grid;place-items:center;font:700 26px var(--zh);transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.brand h1{margin:0;font-size:19px;letter-spacing:-.01em}
.brand small{display:block;color:var(--ink2);font-size:12.5px;margin-top:-2px}
.sync{margin-left:auto;font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block}
.sync.cloud i{background:var(--jade)}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px;overflow-x:auto}
nav button{flex:1;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--ink2);font-weight:500;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--paper)}
nav button .n{font-size:11.5px;opacity:.7;margin-left:4px}
.counts{display:flex;justify-content:center;gap:18px;font-weight:600;font-size:15px;margin:2px 0 12px}
.counts span{display:flex;align-items:center;gap:6px}
.counts em{font-style:normal;font-weight:500;font-size:12px;color:var(--ink2)}
.c-new{color:var(--blue)} .c-lrn{color:var(--red)} .c-rev{color:var(--jade)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px 26px;position:relative}
.badge{position:absolute;top:14px;left:16px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;letter-spacing:.02em}
.b-new{background:var(--blue-soft);color:var(--blue)} .b-lrn{background:var(--red-soft);color:var(--red)} .b-rev{background:var(--jade-soft);color:var(--jade)}
.front{text-align:center;padding:18px 0 6px}
.hz{font-family:var(--zh);font-size:clamp(64px,16vw,112px);line-height:1.1;font-weight:700;letter-spacing:.04em}
.vi-front{font-size:clamp(24px,5vw,34px);font-weight:600;line-height:1.3}
.pos-front{color:var(--ink2);margin-top:6px}
.spk{border:1px solid var(--line);background:transparent;border-radius:99px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink2);vertical-align:middle;flex:none;transition:.15s}
.spk:hover{color:var(--red);border-color:var(--red)}
.spk svg{width:17px;height:17px}
.spk.big{width:48px;height:48px;margin-top:10px}
.spk.big svg{width:22px;height:22px}
.spk.sm{width:28px;height:28px}.spk.sm svg{width:14px;height:14px}
.spk.playing{color:#fff;background:var(--red);border-color:var(--red)}
.divider{border:0;border-top:1px dashed var(--line);margin:22px 0}
.py-main{font-size:24px;font-weight:500;color:var(--red);display:flex;justify-content:center;align-items:center;gap:10px}
.meta{text-align:center;color:var(--ink2);font-size:13.5px;margin-top:4px}
.meta b{color:var(--ink);font-weight:600}
.meaning{text-align:center;font-size:21px;font-weight:600;margin:10px 0 4px}
.note{background:var(--amber-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:14px 0 0}
.note::before{content:'Ghi chú · ';font-weight:700;color:var(--amber)}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h3::after{content:'';flex:1;border-top:1px solid var(--line)}
.ex{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ex li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--paper)}
.ex .num{font:700 13px var(--zh);color:var(--ink3);min-width:16px;padding-top:6px}
.ex .body{flex:1;min-width:0}
.zh{font-family:var(--zh);font-size:20px;line-height:1.45}
.zh mark{background:none;color:var(--red);font-weight:700;border-bottom:2px solid var(--red-soft)}
.pyl{color:var(--ink2);font-size:13.5px;margin-top:1px}
.vil{font-size:14px;margin-top:3px}
.vil.blur{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .2s}
.vil.blur.show{filter:none}
.dlg{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.line{display:flex;gap:10px;padding:8px 0;align-items:flex-start}
.line+.line{border-top:1px dotted var(--line)}
.line{transition:background .2s;border-radius:10px}
.line.speaking{background:var(--amber-soft);margin:0 -8px;padding-left:8px;padding-right:8px}
.sp{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:4px}
.sp-A{background:var(--blue-soft);color:var(--blue)} .sp-B{background:var(--jade-soft);color:var(--jade)}
.line .body{flex:1;min-width:0}
.hvline{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin:0 0 12px;font-size:14px}
.hvline span{display:inline-flex;align-items:baseline;gap:5px;background:var(--paper);padding:4px 10px;border-radius:99px}
.hvline b{font-size:18px}
.hvline i{font-style:normal;color:var(--ink3)}
.hvline .hvsum{background:var(--red-soft);color:var(--red);font-weight:600}
.chxs{display:grid;gap:10px}
.chx{display:flex;gap:14px;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.chx-l{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.chx-c{font:700 46px/1 var(--zh);width:64px;height:64px;display:grid;place-items:center;border-radius:10px;
  background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:50% 50%;background-position:center}
.chx-r{flex:1;min-width:0}
.chx-hv{font-weight:700;letter-spacing:.04em;font-size:15px}
.chx-hv span{font-weight:500;letter-spacing:0;color:var(--red);margin-left:6px;font-size:14px}
.chx-hv .chx-o{color:var(--ink3);font-size:12.5px}
.chx-vi{font-size:14px;margin-top:1px}
.chx-bo{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink2);margin-top:6px}
.chx-bo b{color:var(--ink)}
.chx-bo .bo{font:700 17px var(--zh);color:var(--jade);background:var(--jade-soft);border-radius:7px;min-width:28px;height:28px;display:grid;place-items:center;padding:0 4px}
.chx-tao{font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
.illus{display:flex;flex-direction:column;align-items:center;gap:8px;margin:14px 0 4px}
.illus-img{width:100%;max-width:340px;aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:var(--paper)}
.illus-emo{font-size:64px;line-height:1.1;letter-spacing:.06em}
.illus-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:none;background:var(--paper)}
.thumb.emo{display:grid;place-items:center;font-size:22px}
.stk-btn{padding:4px 9px}
.chx-c{cursor:pointer}
.stk-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.chipb{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer}
.chipb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stk-tabs .chipb{font-size:20px;padding:4px 14px}
.stk-grid{position:relative;margin:0 auto;width:260px;height:260px;background:var(--paper);border:2px solid var(--red-soft);border-radius:12px}
.stk-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stk-bg line{stroke:var(--line);stroke-width:.6;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
#stkTarget{position:relative;touch-action:none}
.stk-info{text-align:center;margin:10px 0;font-size:14px;color:var(--ink2);min-height:20px}
.stk-info b{font-size:20px;color:var(--ink)}
.stk-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.stk-btns .ghost svg{width:17px;height:17px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.ai{background:linear-gradient(135deg,var(--red-soft),var(--amber-soft));border-color:transparent;color:var(--ink);width:100%;margin-top:16px}
.reveal-wrap{margin-top:16px}
.reveal{width:100%;padding:15px;font-size:16px;font-weight:600}
.kbd{font-size:11px;opacity:.6;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grades button{border:0;border-radius:12px;padding:10px 4px;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px}
.grades small{font-weight:500;font-size:12px;opacity:.8}
.g1{background:var(--red-soft);color:var(--red)} .g2{background:var(--amber-soft);color:var(--amber)}
.g3{background:var(--jade-soft);color:var(--jade)} .g4{background:var(--blue-soft);color:var(--blue)}
.grades button:hover{filter:brightness(.96)}
@media (max-width:640px){
  .sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5;margin:0}
  .card{padding:26px 16px}
}
.done{text-align:center;padding:40px 20px}
.done .big{font:700 64px var(--zh);color:var(--jade)}
.done p{color:var(--ink2)}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px}
.toolbar input{flex:1;min-width:160px}
.list{display:grid;gap:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.row:hover{border-color:var(--ink3)}
.row .w{font:700 24px var(--zh);min-width:72px}
.row .info{flex:1;min-width:0}
.row .info div:first-child{color:var(--red);font-size:13.5px}
.row .info div:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.panel h2{margin:0 0 4px;font-size:16px}
.panel p.sub{margin:0 0 12px;color:var(--ink2);font-size:13.5px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
.f+input,.f+textarea,.f+select,input.in,textarea.in,select.in{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px}
textarea.in{resize:vertical;min-height:90px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--ink3);margin-top:4px}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set .t{font-weight:500}.set .d{font-size:12.5px;color:var(--ink2)}
.set select,.set input[type=number]{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 10px;max-width:220px}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.switch span::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--jade)}
.switch input:checked+span::after{transform:translateX(18px)}
.prog{display:grid;gap:6px;margin-top:12px}
.prog div{display:flex;gap:10px;align-items:center;font-size:14px;padding:8px 12px;background:var(--paper);border-radius:10px}
.prog b{font:700 18px var(--zh)}
.prog .st{margin-left:auto;font-size:12.5px;color:var(--ink2)}
.modal-bg{position:fixed;inset:0;background:rgba(20,15,10,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto;z-index:20}
.modal{background:var(--card);border-radius:18px;max-width:720px;width:100%;padding:22px;position:relative;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.modal .x{position:absolute;top:12px;right:12px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink2);width:34px;height:34px;border-radius:50%}
.modal .x:hover{background:var(--paper)}
.modal-bg.full{padding:0;background:var(--paper)}
.modal-bg.full .modal{max-width:none;min-height:100%;border-radius:0;box-shadow:none;background:var(--paper);padding:58px max(16px,calc((100% - 760px)/2)) 60px}
.modal-bg.full .x{position:fixed;top:10px;right:12px;z-index:3;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);width:40px;height:40px}
.modal-bg.full .back{position:fixed;top:10px;left:12px;z-index:3;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:500;box-shadow:var(--shadow)}
.layer-bg{z-index:30}
.layer-bg .modal{max-width:460px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90vw;box-shadow:var(--shadow);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.empty{color:var(--ink2);text-align:center;padding:30px}
.hidden{display:none!important}
.qz-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:8px}
.qz-bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.qz-bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.qz-vi{font-size:clamp(19px,4.6vw,24px);font-weight:600;line-height:1.45;text-align:center;margin:16px 0 12px}
.qz-need{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.qz-need b{font:700 22px var(--zh);color:var(--red)}
.qz-in{width:100%;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;font:22px/1.5 var(--zh);margin-top:16px;resize:none;min-height:64px}
.qz-in:focus{outline:none;border-color:var(--ink3)}
.qz-res{border-radius:12px;padding:12px 14px;margin-top:14px}
.qz-res.ok{background:var(--jade-soft)} .qz-res.mid{background:var(--amber-soft)} .qz-res.bad{background:var(--red-soft)}
.qz-res .v{font-weight:700;margin-bottom:4px}
.qz-res.ok .v{color:var(--jade)} .qz-res.mid .v{color:var(--amber)} .qz-res.bad .v{color:var(--red)}
.qz-lbl{font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin-top:10px}
.qz-ans{font:20px/1.5 var(--zh)} .qz-ans s{color:var(--red);text-decoration:none;border-bottom:2px solid var(--red)}
.qz-ref{display:flex;gap:10px;align-items:flex-start}
.qz-sum{text-align:center;padding:10px 0 4px}
.qz-sum .big{font:700 56px var(--zh)}
.qz-list{display:grid;gap:6px;margin-top:14px}
.qz-list div{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;background:var(--paper);border-radius:10px;font-size:14px}
.qz-list .ic{flex:none;width:20px;text-align:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.type-in{text-align:center;font-size:20px;margin-top:18px}
.type-in.vi{font:500 18px 'Be Vietnam Pro',system-ui,sans-serif}
.typed{margin:0 0 16px}
.grades button.sug{box-shadow:0 0 0 2px currentColor;transform:translateY(-1px)}
@media (max-width:480px){nav button{padding:9px 7px;font-size:14px}nav button .n{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seal">漢</div>
    <div class="brand"><h1>Hán Tự Mỗi Ngày</h1><small>Học từ vựng tiếng Trung kiểu Anki</small></div>
    <div class="sync" id="sync"><i></i><span>Lưu trên máy này</span></div>
  </header>
  <nav id="nav">
    <button data-view="hoc" class="on">Học</button>
    <button data-view="tu-vung">Từ vựng<span class="n" id="navCount"></span></button>
    <button data-view="kiem-tra">Kiểm tra</button>
    <button data-view="them">Thêm từ</button>
    <button data-view="cai-dat">Cài đặt</button>
  </nav>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="layerRoot"></div>
<input type="file" id="photoIn" accept="image/*" class="hidden">

<script>
/* ============ STARTER DECK (phồn thể, Đài Loan) ============ */

function charsOf(c){
  if(Array.isArray(c.chars)&&c.chars.length)return {list:c.chars,missing:false};
  const chs=[...(c.w||'')].filter(x=>/\p{Script=Han}/u.test(x));
  const list=chs.map(x=>CHAR_DB[x]).filter(Boolean);
  return {list,missing:list.length<chs.length};
}

const $$=(s,r=document)=>[...r.querySelectorAll(s)];

const MIN=60e3,HOUR=3600e3,DAY=86400e3;
const STEPS=[1*MIN,10*MIN],RELEARN=[10*MIN];

function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function dayKey(){const d=new Date(Date.now()-4*HOUR);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function nextDayStart(){const d=new Date();d.setHours(4,0,0,0);if(Date.now()>=d.getTime())d.setDate(d.getDate()+1);return d.getTime();}
function fmtIvl(ms){
  if(ms<HOUR)return Math.max(1,Math.round(ms/MIN))+' phút';
  if(ms<DAY)return Math.round(ms/HOUR)+' giờ';
  if(ms<30*DAY)return Math.round(ms/DAY)+' ngày';
  if(ms<365*DAY)return (+(ms/(30*DAY)).toFixed(1))+' tháng';
  return (+(ms/(365*DAY)).toFixed(1))+' năm';
}

const DEFAULT_SETTINGS={script:'t',voice:'auto',rate:1,voiceV:2,newPerDay:10,reverse:false,autoplay:true,hideTrans:false,showPy:true,picFront:false,typeAns:true,level:'Trung cấp',removed:[],day:'',newDone:0,extraNew:0};
let settings={...DEFAULT_SETTINGS};
let saved={};   // các thẻ đã học/sửa/tự thêm
let cards={};   // bộ thẻ đang dùng
let view='hoc', cur=null, revealed=false, lastId=null, sessionCount=0;
let cloud=null, sample=null, ttsCap=null, conv=null;

const LS='hantu-v1';
function loadLocal(){try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);saved=o.cards||{};settings={...DEFAULT_SETTINGS,...(o.settings||{})};return true;}}catch(e){}return false;}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify({cards:saved,settings}));}catch(e){}}
function rebuild(){
  cards={};
  for(const c of STARTER){if(!settings.removed.includes(c.id))cards[c.id]=structuredClone(c);}
  for(const id in saved){if(saved[id])cards[id]=saved[id];}
}
const wq={};
function qWrite(key,fn){const p=(wq[key]||Promise.resolve()).then(fn).catch(e=>{console.warn('db',e);if(e&&e.code==='quota_exceeded')toast('Bộ nhớ đồng bộ đã đầy, hãy xóa bớt thẻ.');});wq[key]=p;return p;}
function plain(o){return JSON.parse(JSON.stringify(o));}
function saveCard(c){saved[c.id]=c;cards[c.id]=c;persistLocal();if(cloud){const d=plain(c);qWrite('c:'+c.id,()=>cloud.cards.doc(c.id).set(d));}}
function removeCard(id){
  const c=cards[id];delete saved[id];delete cards[id];
  if(c&&c.starter&&!settings.removed.includes(id)){settings.removed=[...settings.removed,id];saveSettings();}
  persistLocal();if(cloud)qWrite('c:'+id,()=>cloud.cards.doc(id).delete());
}
let sTimer=null;
function saveSettings(){persistLocal();if(cloud){clearTimeout(sTimer);sTimer=setTimeout(()=>{const d=plain(settings);qWrite('settings',()=>cloud.settings.set(d));},500);}}
async function pushAll(){
  if(!cloud)return;
  for(const id in saved){const d=plain(saved[id]);await qWrite('c:'+id,()=>cloud.cards.doc(id).set(d));}
  const s=plain(settings);await qWrite('settings',()=>cloud.settings.set(s));
}
function setSync(mode,txt){
  const el=$('#sync');el.classList.toggle('cloud',mode==='cloud');
  $('span',el).textContent=txt||(mode==='cloud'?'Đã đồng bộ với tài khoản':'Lưu trên trình duyệt này');
}
async function initCloud(){
  if(!window.claude||!window.claude.use){setSync('local');return;}
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){setSync('local');return;}
    const id=await user.id();if(!id){setSync('local');return;}
    const base='data/users/'+id;
    const c={settings:db.doc(base+'/settings'),cards:db.doc(base+'/deck').collection('cards')};
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000));
    const [sSnap,cSnap]=await Promise.race([Promise.all([c.settings.get(),c.cards.get()]),timeout]);
    cloud=c;
    if(sSnap.exists||cSnap.size>0){
      const cc={};cSnap.docs.forEach(d=>{if(d.exists)cc[d.id]=structuredClone(d.data());});
      saved=cc;settings={...DEFAULT_SETTINGS,...(sSnap.exists?structuredClone(sSnap.data()):{})};persistLocal();
    }else{await pushAll();}
    setSync('cloud');migrate();ensureDay();rebuild();if(view==='hoc'){cur=null;revealed=false;}render();
  }catch(e){console.warn(e);setSync('local',e&&e.code==='timeout'?'Chưa kết nối được — tạm lưu trên máy':'');}
}

let zhVoices=[];
function loadVoices(){
  if(!('speechSynthesis' in window))return;
  zhVoices=speechSynthesis.getVoices().filter(v=>/^(zh|cmn)/i.test(v.lang));
  if(view==='cai-dat')renderSettingsVoices();
}

const FEMALE=/hsiaochen|hsiaoyu|yating|hanhan|mei-?jia|ting-?ting|xiaoxiao|xiaoyi|xiaohan|xiaomo|xiaorui|xiaoshuang|xiaoxuan|xiaoyan|xiaomeng|xiaochen|huihui|yaoyao|lili|sin-?ji|hiumaan|hiugaai|google|female|女/i;
const MALE=/zhiwei|yunxi|yunyang|yunjian|yunye|yunze|yunhao|kangkang|li-?mu|danny|wanlung|male|男/i;
const QUALITY=/natural|neural|online|enhanced|premium|google|siri/i;
function gender(v){return MALE.test(v.name)?'m':FEMALE.test(v.name)?'f':'?';}
function voiceList(){
  const want=langCode().toLowerCase();
  const score=v=>{const l=v.lang.toLowerCase().replace('_','-');
    const ls=l===want?0:(l.startsWith('zh-tw')||l.startsWith('zh-cn'))?1:/hk|yue/.test(l)?3:2;
    const g=gender(v),gs=g==='f'?0:g==='?'?3:6;
    return ls*10+gs+(QUALITY.test(v.name)?0:2);};
  return [...zhVoices].sort((a,b)=>score(a)-score(b));
}
function pickVoice(alt){
  const list=voiceList();if(!list.length)return null;
  let main=list.find(v=>v.voiceURI===settings.voice)||list[0];
  if(!alt)return main;
  const same=v=>v!==main&&v.lang.slice(0,5)===main.lang.slice(0,5);
  const other=list.find(v=>same(v)&&gender(v)==='f')||list.find(same);
  return other||main;
}
function engine(){
  if(String(settings.voice).startsWith('claude')&&ttsCap)return 'claude';
  if('speechSynthesis' in window&&zhVoices.length)return 'browser';
  if(ttsCap)return 'claude';
  if('speechSynthesis' in window)return 'browser';
  return 'none';
}
let spTok=0,activeBtn=null;
function markBtn(b){if(activeBtn)activeBtn.classList.remove('playing');activeBtn=b||null;if(b)b.classList.add('playing');}
function stopSpeech(){spTok++;try{speechSynthesis.cancel();}catch(e){}try{ttsCap&&ttsCap.stop();}catch(e){}markBtn(null);resetPlayBtns();$$('.line.speaking').forEach(r=>r.classList.remove('speaking'));}
const CLAUDE_VOICES=['airy','glassy','rounded','buttery'];
function claudeVoice(alt){const v=String(settings.voice).split(':')[1]||'airy';if(!alt)return v;return CLAUDE_VOICES.find(x=>x!==v)||v;}
const claudeRate=()=>Math.min(1.5,Math.max(.7,settings.rate));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const liveUtt=[];
function speakBrowser(text,{alt=false,pitch=1}={}){
  return new Promise(res=>{
    const u=new SpeechSynthesisUtterance(text);const v=pickVoice(alt);
    if(v){u.voice=v;u.lang=v.lang;}else u.lang=langCode();
    u.rate=settings.rate;u.pitch=pitch;u.volume=1;
    const done=()=>{const i=liveUtt.indexOf(u);if(i>=0)liveUtt.splice(i,1);res();};
    u.onend=u.onerror=done;liveUtt.push(u); // giữ tham chiếu để trình duyệt không cắt ngang
    try{speechSynthesis.resume();}catch(e){}
    speechSynthesis.speak(u);
  });
}
async function speak(text,btn){
  const wasBusy='speechSynthesis' in window&&(speechSynthesis.speaking||speechSynthesis.pending);
  stopSpeech();const tok=spTok;markBtn(btn);
  const e=engine();
  try{
    if(e==='browser'){if(wasBusy)await sleep(120);if(tok!==spTok)return;await speakBrowser(text);}
    else if(e==='claude')await ttsCap.speak(text,{language:langCode(),voice:claudeVoice(false),rate:claudeRate()});
    else toast('Thiết bị này chưa có giọng đọc tiếng Trung. Hãy cài giọng Trung (Đài Loan) trong cài đặt máy.',4200);
  }catch(err){if(err&&err.code==='not_granted'){ttsCap=null;}}
  if(tok===spTok)markBtn(null);
}
async function playDialogue(lines,btn){
  if(btn&&btn.dataset.playing){stopSpeech();return;}
  stopSpeech();const tok=spTok;
  if(btn){btn.dataset.playing='1';btn.innerHTML='■ Dừng';}
  const box=btn&&btn.closest('.dlg');const rows=box?[...box.querySelectorAll('.line')]:[];
  const e=engine();
  if(e==='none'){toast('Thiết bị này chưa có giọng đọc tiếng Trung.');resetPlayBtns();return;}
  if(e==='browser')await sleep(150); // trình duyệt cần nghỉ một chút sau khi dừng câu trước
  for(let i=0;i<lines.length;i++){
    if(tok!==spTok)break;
    rows.forEach((r,j)=>r.classList.toggle('speaking',j===i));
    const text=disp(lines[i].zh);
    try{
      if(e==='claude')await ttsCap.speak(text,{language:langCode(),voice:claudeVoice(false),rate:claudeRate()});
      else await withTimeout(speakBrowser(text),text.length*450/settings.rate+3000);

    if(tok!==spTok)break;
    await sleep(350);
  }
  rows.forEach(r=>r.classList.remove('speaking'));
  if(tok===spTok)resetPlayBtns();
}
function withTimeout(p,ms){return Promise.race([p,sleep(ms)]);}
function hasAltVoice(){const a=pickVoice(false),b=pickVoice(true);return a&&b&&a!==b;}

/* ============ LẶP LẠI NGẮT QUÃNG (kiểu Anki/SM-2) ============ */
function schedule(prev,g,now,fuzz){
  const s={state:'new',step:0,ivl:0,ease:2.5,reps:0,lapses:0,due:now,...(prev||{})};
  const F=x=>fuzz&&x>2?Math.round(x*(0.95+Math.random()*0.1)):Math.round(x);
  if(s.state==='new'){s.state='learning';s.step=0;}
  if(s.state==='learning'||s.state==='relearning'){
    const steps=s.state==='learning'?STEPS:RELEARN;
    if(g===1){s.step=0;s.due=now+steps[0];}
    else if(g===2){const c=steps[Math.min(s.step,steps.length-1)],n=steps[s.step+1];s.due=now+(n?(c+n)/2:c*1.5);}
    else if(g===3){s.step+=1;if(s.step>=steps.length){if(s.state==='learning')s.ivl=1;s.state='review';s.step=0;s.due=now+s.ivl*DAY;}else s.due=now+steps[s.step];}
    else{s.ivl=s.state==='learning'?4:Math.max(s.ivl+1,Math.round(s.ivl*1.2));s.state='review';s.step=0;s.due=now+s.ivl*DAY;}
  }else{
    if(g===1){s.lapses++;s.ease=Math.max(1.3,s.ease-0.2);s.ivl=Math.max(1,Math.round(s.ivl*0.5));s.state='relearning';s.step=0;s.due=now+RELEARN[0];}
    else{let iv;
      if(g===2){iv=Math.max(s.ivl+1,s.ivl*1.2);s.ease=Math.max(1.3,s.ease-0.15);}
      else if(g===3)iv=Math.max(s.ivl+1,s.ivl*s.ease);
      else{iv=Math.max(s.ivl+2,s.ivl*s.ease*1.3);s.ease+=0.15;}
      s.ivl=Math.min(36500,F(iv));s.due=now+s.ivl*DAY;}
  }
  return s;
}
const isNew=c=>!c.srs||c.srs.state==='new';
const isLrn=c=>c.srs&&(c.srs.state==='learning'||c.srs.state==='relearning');
function newLeft(){return Math.max(0,settings.newPerDay+settings.extraNew-settings.newDone);}
function counts(){
  const now=Date.now(),nd=nextDayStart();let n=0,l=0,r=0;
  for(const c of Object.values(cards)){if(isNew(c))n++;else if(isLrn(c)){if(c.srs.due<=now+20*MIN)l++;}else if(c.srs.due<nd)r++;}
  return {n:Math.min(n,newLeft()),l,r,totalNew:n};
}
function pickNext(){
  const now=Date.now(),nd=nextDayStart(),all=Object.values(cards);
  const lrn=all.filter(isLrn);
  const lrnDue=lrn.filter(c=>c.srs.due<=now).sort((a,b)=>a.srs.due-b.srs.due);
  const rev=all.filter(c=>c.srs&&c.srs.state==='review'&&c.srs.due<nd).sort((a,b)=>a.srs.due-b.srs.due);
  const nw=newLeft()>0?all.filter(isNew).sort((a,b)=>a.ord-b.ord):[];
  const avoid=l=>l.filter(c=>c.id!==lastId);
  const from=l=>avoid(l)[0]||l[0];
  if(lrnDue.length&&avoid(lrnDue).length)return avoid(lrnDue)[0];
  if(rev.length&&nw.length)return sessionCount%3===2?nw[0]:from(rev);
  if(rev.length)return from(rev);
  if(nw.length)return nw[0];
  if(lrnDue.length)return lrnDue[0];
  const ahead=lrn.filter(c=>c.srs.due<=now+20*MIN).sort((a,b)=>a.srs.due-b.srs.due);
  if(ahead.length)return from(ahead);
  return null;
}

function levelDesc(){return {'Cơ bản':'sơ cấp (TOCFL A1–A2): câu ngắn, từ vựng thông dụng','Trung cấp':'trung cấp (TOCFL B1–B2): câu tự nhiên, độ dài vừa','Nâng cao':'nâng cao (TOCFL C1–C2): câu tự nhiên như người bản xứ, có thể dùng thành ngữ khi hợp'}[settings.level]||'trung cấp';}

- Pinyin có dấu thanh, viết liền theo từ, có dấu câu (ví dụ: "Wǒ zài Táiwān xuéxí Zhōngwén."), theo cách đọc chuẩn ở Đài Loan.

${rules()}
- Trường "s" là dạng giản thể của từ chính.
Chỉ trả về JSON đúng dạng sau, không thêm chữ nào khác:
{"w":"từ chính (phồn thể)","s":"giản thể","py":"pinyin của từ","hv":"âm Hán Việt, chữ thường","pos":"từ loại bằng tiếng Việt","vi":"nghĩa tiếng Việt ngắn gọn, nhiều nghĩa thì cách nhau bằng dấu ;","note":"một câu ghi chú cách dùng hoặc phân biệt với từ gần nghĩa, bằng tiếng Việt","ex":[{"zh":"","py":"","vi":""}],"dlg":[{"sp":"A","zh":"","py":"","vi":""},{"sp":"B","zh":"","py":"","vi":""}]}
"ex" có đúng 4 câu với ngữ cảnh và độ dài khác nhau. "dlg" là một đoạn hội thoại 4–6 lượt luân phiên giữa A và B.

function promptChars(c){return `Bạn là giáo viên chữ Hán dạy người Việt. Hãy phân tích từng chữ Hán trong từ: ${c.w} (${c.py}) — ${c.vi}.
Chỉ trả về JSON đúng dạng {"chars":[...]}, trong đó "chars" là ${CHARS_SPEC}`;}
function cleanChars(a){return Array.isArray(a)?a.filter(x=>x&&str(x.ch)).slice(0,12).map(x=>({ch:str(x.ch),py:str(x.py),hv:str(x.hv),vi:str(x.vi),bo:str(x.bo),boTen:str(x.boTen),boNghia:str(x.boNghia),tao:str(x.tao)})):[];}
function promptSvg(c){return `Hãy vẽ một hình minh họa SVG giúp người Việt nhớ từ tiếng Trung "${c.w}" (${c.py}), nghĩa: ${c.vi}.
Yêu cầu:
- Một cảnh hoặc đồ vật dễ hiểu thể hiện đúng nghĩa của từ; nếu là từ trừu tượng, dùng một tình huống đời thường ở Đài Loan để gợi nghĩa.
- Phong cách phẳng (flat), dễ thương, đường nét gọn, màu ấm dịu, có nền màu nhạt phủ kín khung.
- KHÔNG có chữ, số hay ký tự nào trong hình.
- viewBox="0 0 320 240", chỉ dùng các hình cơ bản (rect, circle, ellipse, path, polygon, line, g), có thể dùng linearGradient. Không script, không ảnh ngoài, không foreignObject.
- Dưới 6000 ký tự.
Chỉ trả về đúng mã <svg>…</svg>, không giải thích.`;}
function cleanSvg(t){
  const m=String(t||'').match(/<svg[\s\S]*<\/svg>/i);if(!m)return '';
  try{
    const doc=new DOMParser().parseFromString(m[0],'image/svg+xml');const svg=doc.documentElement;
    if(svg.nodeName.toLowerCase()!=='svg'||doc.querySelector('parsererror'))return '';
    doc.querySelectorAll('script,foreignObject,image,use,a,iframe').forEach(n=>n.remove());
    doc.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/href$/i.test(a.name))n.removeAttribute(a.name);}));
    svg.setAttribute('xmlns','http://www.w3.org/2000/svg');if(!svg.getAttribute('viewBox'))svg.setAttribute('viewBox','0 0 320 240');
    svg.removeAttribute('width');svg.removeAttribute('height');
    const out=new XMLSerializer().serializeToString(svg);return out.length<60000?out:'';
  }catch(e){return '';}
}

function parseJsonLoose(t){
  try{return JSON.parse(t);}catch(e){}
  const s=String(t).replace(/^```(?:json)?/i,'').replace(/```\s*$/,'').trim();
  try{return JSON.parse(s);}catch(e){}
  const m=s.match(/[\[{][\s\S]*[\]}]/);if(m){try{return JSON.parse(m[0]);}catch(e){}}
  throw {code:'bad',message:'AI trả về dữ liệu không đọc được'};
}
async function gemFetch(path,opts){
  let r;
  try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/'+path,{...opts,headers:{'Content-Type':'application/json','x-goog-api-key':gem.key,...((opts&&opts.headers)||{})}});}
  catch(e){throw {code:'network',message:'Không kết nối được tới Gemini. Kiểm tra mạng nhé.'};}
  if(!r.ok){let msg='';try{msg=(await r.json()).error.message||'';}catch(e){}
    throw {code:r.status===429?'rate_limited':(r.status===400||r.status===401||r.status===403)?'bad_key':r.status===404?'bad_model':'unavailable',message:msg||('Lỗi '+r.status)};}
  return r.json();
}
function makeGemini(){
  if(!gem.key)return null;
  const call=async(prompt,json)=>{
    const model=gem.model||'gemini-2.5-flash';
    const d=await gemFetch('models/'+encodeURIComponent(model)+':generateContent',{method:'POST',body:JSON.stringify({
      contents:[{role:'user',parts:[{text:prompt}]}],
      generationConfig:json?{responseMimeType:'application/json',temperature:0.7}:{temperature:0.8}})});
    const parts=(d&&d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];
    const text=parts.filter(p=>!p.thought).map(p=>p.text||'').join('');
    if(!text)throw {code:'empty',message:'Gemini không trả lời (có thể bị bộ lọc chặn).'};
    return text;
  };
  const toText=p=>typeof p==='string'?p:(Array.isArray(p)?p.map(m=>m.content).join('\n\n'):String(p));
  const fn=async(prompt)=>({text:await call(toText(prompt),false),truncated:false});
  fn.json=async(prompt)=>parseJsonLoose(await call(toText(prompt),true));
  fn.isGemini=true;
  return fn;
}
function pickGemModel(ids){
  const ok=ids.filter(n=>/flash/.test(n)&&!/lite|image|tts|live|audio|embed|robotics|exp-/.test(n));
  const ver=n=>{const v=n.match(/gemini-(\d+(?:\.\d+)?)/);return v?parseFloat(v[1]):0;};
  ok.sort((a,b)=>(ver(b)-ver(a))||((/preview/.test(a))-(/preview/.test(b)))||(a.length-b.length));
  return ok[0]||ids[0]||'';
}

let typed=null;
const viNorm=t=>String(t||'').toLowerCase().normalize('NFC').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
const viBare=t=>viNorm(t).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const pyBare=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/v/g,'u').replace(/[^a-z0-9]/g,'');
function checkTyped(c,ans){
  if(settings.reverse){
    const a=normZh(toSimp(ans));
    const forms=[c.w,c.s,disp(c.w)].filter(Boolean).map(x=>normZh(toSimp(x)));
    if(a&&forms.includes(a))return {v:'ok',note:''};
    if(/[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/.test(ans)&&pyBare(ans)===pyBare(c.py))return {v:'mid',note:'Đúng pinyin rồi, lần sau thử gõ chữ Hán nhé.'};
    const hit=[...a].filter(ch=>forms[0].includes(ch)).length;
    return {v:'bad',note:hit?`Đúng ${hit}/${[...forms[0]].length} chữ.`:''};
  }
  const a=viNorm(ans),ab=viBare(ans);
  const opts=[c.vi,...String(c.vi||'').split(/[;,/()]|\bhoặc\b/)].map(viNorm).filter(Boolean);
  const words=s=>s.split(' ');
  const match=(x,list)=>list.some(o=>o===x||(x.length>=2&&(` ${o} `.includes(` ${x} `)||` ${x} `.includes(` ${o} `))));
  if(match(a,opts))return {v:'ok',note:''};
  if(match(ab,opts.map(viBare)))return {v:'mid',note:'Đúng nghĩa nhưng sai hoặc thiếu dấu.'};
  const all=new Set(opts.flatMap(words));const share=words(a).filter(w=>w.length>1&&all.has(w)).length;
  return {v:'bad',note:share?'Có một phần đúng.':''};
}

const BACKUP_NAME='hantu-saoluu';
function downloadFile(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);}
function pickFile(cb){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(String(r.result));r.readAsText(f);};i.click();}

/* ============ NÉT VIẾT CHỮ HÁN (Hanzi Writer) ============ */
let hwLoading=null,strokeW=null,strokeChars=[],strokeIdx=0,strokeStep=0,strokeCount=0;
function loadHW(){
  if(window.HanziWriter)return Promise.resolve(window.HanziWriter);
  if(hwLoading)return hwLoading;
  hwLoading=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js';s.onload=()=>res(window.HanziWriter);s.onerror=()=>{hwLoading=null;s.remove();rej();};document.head.appendChild(s);});
  return hwLoading;
}
const isHan=ch=>/\p{Script=Han}/u.test(ch);
function strokeBtn(word,ch,small){return `<button class="btn sm stk-btn" data-stroke="${esc(ch||'')}" data-strokeword="${esc(word)}" title="Xem thứ tự nét viết">✍️${small?'':' Nét viết'}</button>`;}
function openStroke(word,start){
  const chars=[...String(word||'')].filter(isHan);if(!chars.length)return;
  strokeChars=chars;strokeIdx=Math.max(0,chars.indexOf(start));
  openLayer(`<h2 style="margin:0 0 4px">✍️ Nét viết</h2><p class="sub" style="color:var(--ink2);margin:0 0 10px">Xem thứ tự nét rồi tự viết thử bằng chuột hoặc ngón tay.</p>
  ${chars.length>1?`<div class="stk-tabs">${chars.map((c,i)=>`<button class="chipb zh" data-stk="${i}">${esc(c)}</button>`).join('')}</div>`:''}
  <div class="stk-grid"><svg class="stk-bg" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/></svg><div id="stkTarget"></div></div>
  <div class="stk-info" id="stkInfo">Đang tải…</div>
  <div class="stk-btns"><button class="btn primary" id="stkPlay">▶ Xem viết</button><button class="btn" id="stkStep">Từng nét</button><button class="btn" id="stkLoop">🔁 Lặp lại</button><button class="btn" id="stkQuiz">✍️ Tự viết thử</button><button class="btn ghost" id="stkSpk">${ICON_SPK}</button></div>
  <div class="hint" style="text-align:center;margin-top:10px">Phần tô xanh là bộ thủ. Dữ liệu nét viết được tải từ internet nên cần có mạng.</div>`);
  $$('[data-stk]').forEach(b=>b.onclick=()=>{strokeIdx=+b.dataset.stk;mountStroke();});
  $('#stkPlay').onclick=()=>{if(!strokeW)return;strokeStep=0;strokeW.cancelQuiz();strokeW.animateCharacter({onComplete:()=>setInfo()});};
  $('#stkLoop').onclick=()=>{if(!strokeW)return;strokeW.cancelQuiz();strokeW.loopCharacterAnimation();setInfo('Đang lặp lại · bấm “Xem viết” hoặc “Từng nét” để dừng');};
  $('#stkStep').onclick=()=>{
    if(!strokeW||!strokeCount)return;strokeW.cancelQuiz();
    if(strokeStep===0||strokeStep>=strokeCount){strokeW.hideCharacter();strokeStep=0;}
    strokeW.animateStroke(strokeStep);strokeStep++;
    setInfo(`Nét ${strokeStep}/${strokeCount}${strokeStep>=strokeCount?' · xong! Bấm lần nữa để xem lại từ đầu':''}`);
  };
  $('#stkQuiz').onclick=()=>{
    if(!strokeW)return;strokeStep=0;
    setInfo('Viết từng nét theo đúng thứ tự vào ô. Sai 3 lần app sẽ gợi ý.');
    strokeW.quiz({
      onCorrectStroke:s=>setInfo(`✓ Đúng nét ${s.strokeNum+1}/${strokeCount}`),
      onMistake:s=>setInfo(`✗ Chưa đúng nét ${s.strokeNum+1} — thử lại${s.mistakesOnStroke>=3?' (đã hiện gợi ý)':''}`),
      onComplete:sm=>{setInfo(`🎉 Viết xong! Sai ${sm.totalMistakes} lần.`);toast(sm.totalMistakes===0?'Viết chuẩn không sai nét nào! 太棒了！':'Xong rồi, luyện thêm vài lần nữa nhé!');}
    });
  };
  $('#stkSpk').onclick=e=>speak(strokeChars[strokeIdx],e.currentTarget);
  mountStroke();
}
function setInfo(extra){const el=$('#stkInfo');if(!el)return;const ch=strokeChars[strokeIdx];el.innerHTML=`<b class="zh">${esc(ch)}</b>${strokeCount?` · ${strokeCount} nét`:''}${extra?` · ${esc(extra)}`:''}`;}
async function mountStroke(){
  const el=document.getElementById('stkTarget');if(!el)return;
  el.innerHTML='';strokeW=null;strokeStep=0;strokeCount=0;
  $$('[data-stk]').forEach(b=>b.classList.toggle('on',+b.dataset.stk===strokeIdx));
  const ch=strokeChars[strokeIdx],info=$('#stkInfo');info.textContent='Đang tải nét viết…';
  try{
    const H=await loadHW();if(!document.getElementById('stkTarget'))return;
    const dark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
    const size=Math.max(200,Math.min(290,window.innerWidth-90));
    const grid=el.parentElement;grid.style.width=size+'px';grid.style.height=size+'px';
    const w=H.create(el,ch,{width:size,height:size,padding:14,showOutline:true,strokeAnimationSpeed:1,delayBetweenStrokes:260,
      strokeColor:dark?'#f0e8d9':'#231e18',radicalColor:dark?'#62b98b':'#2c7553',outlineColor:dark?'#3a3229':'#e7dcc8',
      highlightColor:'#e0a84a',drawingColor:dark?'#e4705f':'#b3362b',drawingWidth:20,showHintAfterMisses:3,
      onLoadCharDataSuccess:d=>{if(strokeW!==w)return;strokeCount=(d&&d.strokes&&d.strokes.length)||0;setInfo();w.animateCharacter();},
      onLoadCharDataError:()=>{if(strokeW!==w)return;info.textContent='Chưa có dữ liệu nét viết cho chữ này, hoặc đang không có mạng.';}});
    strokeW=w;
  }catch(e){info.textContent='Không tải được công cụ nét viết. Hãy kiểm tra kết nối internet.';}
}

/* ============ KIỂM TRA: DỊCH CÂU VIỆT → TRUNG ============ */
let qz=null; // {items,i,phase:'ask'|'grading'|'graded'|'done',res:[]}
let qzOpt={src:'learned',n:10,gen:'ex',hint:'word',pick:[]};
try{Object.assign(qzOpt,JSON.parse(localStorage.getItem('hantu-quiz-opt')||'{}'));}catch(e){}
function saveQzOpt(){try{localStorage.setItem('hantu-quiz-opt',JSON.stringify(qzOpt));}catch(e){}}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
function qzPool(){
  const all=Object.values(cards);
  if(qzOpt.src==='pick'){const set=new Set(qzOpt.pick||[]);return all.filter(c=>set.has(c.id));}
  if(qzOpt.src==='learned')return all.filter(c=>!isNew(c));
  if(qzOpt.src==='hard')return all.filter(c=>c.srs&&(isLrn(c)||c.srs.lapses>0||c.srs.ease<2.4));
  return all;
}
function hasWord(c,t){return !!t&&(t.includes(c.w)||(c.s&&t.includes(c.s)));}
function sentencesOf(c){
  const out=(c.ex||[]).filter(e=>e.zh&&e.vi).map(e=>({zh:e.zh,py:e.py,vi:e.vi}));
  (c.dlgs||[]).forEach(d=>d.forEach(l=>{if(l.zh&&l.vi&&hasWord(c,l.zh)&&[...l.zh].length>=4)out.push({zh:l.zh,py:l.py,vi:l.vi});}));
  return out;
}
function buildFromExamples(pool,n){
  const bags=shuffle(pool).map(c=>({c,s:shuffle(sentencesOf(c))})).filter(b=>b.s.length);
  const items=[];
  while(items.length<n&&bags.some(b=>b.s.length)){
    for(const b of bags){if(items.length>=n)break;const x=b.s.pop();if(x)items.push({id:b.c.id,...x});}
  }
  return shuffle(items);
}
function promptQuizGen(list){return `Bạn là giáo viên tiếng Trung dạy người Việt. Hãy viết đề luyện dịch câu từ tiếng Việt sang tiếng Trung.
Với MỖI từ dưới đây, viết đúng 1 câu mới (khác các câu ví dụ thường gặp), câu nào cũng phải dùng đúng từ đó:
${list.map(c=>`- ${c.w} (${c.py}): ${c.vi}`).join('\n')}
${rules()}
- Câu tiếng Việt phải rõ nghĩa để người học dịch ngược ra đúng ý; không dùng tên riêng khó.
Chỉ trả về JSON đúng dạng: {"items":[{"w":"từ","vi":"câu tiếng Việt","zh":"câu tiếng Trung đáp án (phồn thể)","py":"pinyin"}]}`;}
async function buildFromAI(pool,n){
  const pick=shuffle(pool).slice(0,n);
  const r=await sample.json(promptQuizGen(pick),{modelTier:'default'});
  const arr=Array.isArray(r&&r.items)?r.items:[];
  const items=[];
  for(const x of arr){
    const c=pick.find(c=>c.w===str(x.w)||c.s===str(x.w))||pick[items.length];
    if(c&&str(x.vi)&&str(x.zh))items.push({id:c.id,vi:str(x.vi),zh:str(x.zh),py:str(x.py),ai:true});
  }
  if(!items.length)throw {code:'bad'};
  return items;
}
async function startQuiz(retryItems){
  let items=retryItems;
  if(!items){
    const pool=qzPool();
    if(!pool.length){toast(qzOpt.src==='pick'?'Bạn chưa chọn từ nào. Bấm “Chọn từ” để chọn nhé.':qzOpt.src==='learned'?'Bạn chưa học từ nào. Chọn “Tất cả từ” hoặc học vài thẻ trước nhé.':'Chưa có từ nào phù hợp.',3500);return;}
    if(qzOpt.gen==='ai'&&sample){
      const b=$('#qzStart');if(b){b.disabled=true;b.textContent='AI đang ra đề…';}
      try{items=await buildFromAI(pool,qzOpt.n);}catch(e){aiErr(e);if(b){b.disabled=false;b.textContent='Bắt đầu';}return;}
    }else{
      items=buildFromExamples(pool,qzOpt.n);
      if(!items.length){toast('Các từ này chưa có câu ví dụ. Hãy bật “Câu mới do AI viết” hoặc thêm câu ví dụ.',4000);return;}
    }
  }
  qz={items,i:0,phase:'ask',res:[]};render();
}
/* ---- chấm điểm ---- */
const normZh=t=>String(t||'').replace(/[\s\p{P}\p{S}]/gu,'');
function toSimp(t){return conv?conv(t):t;}
function lcsMark(a,b){ // trả về độ giống và mảng đánh dấu ký tự của a có trong b
  const A=[...a],B=[...b],n=A.length,m=B.length;
  const d=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=A[i]===B[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const keep=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){keep[i]=true;i++;j++;}else if(d[i+1][j]>=d[i][j+1])i++;else j++;}
  return {sim:n+m?2*d[0][0]/(n+m):1,keep};
}
function gradeLocal(it,ans){
  const c=cards[it.id]||{};
  const a=normZh(toSimp(ans)),r=normZh(toSimp(it.zh));
  const {sim}=lcsMark(a,r);
  const used=hasWord(c,ans)||(conv&&c.w&&ans.includes(conv(c.w)));
  let v=a===r?'ok':(sim>=.75&&used?'mid':'bad');
  const fb=v==='ok'?'Khớp với đáp án mẫu.':!used?`Câu của bạn chưa dùng từ “${c.w||''}”.`:`Giống đáp án mẫu khoảng ${Math.round(sim*100)}%. Cách nói khác vẫn có thể đúng — tự so với đáp án nhé.`;
  return {v,fb,local:true};
}
function promptGrade(it,ans){const c=cards[it.id]||{};return `Bạn là giáo viên tiếng Trung chấm bài dịch Việt → Trung của học viên người Việt đang sống ở Đài Loan.
Câu tiếng Việt: "${it.vi}"
Từ bắt buộc phải dùng: ${c.w} (${c.py}) — ${c.vi}
Đáp án mẫu: ${it.zh}
Bài làm của học viên: "${ans}"
Cách chấm:
- Chấm theo NGHĨA và NGỮ PHÁP, không bắt giống hệt đáp án mẫu. Chấp nhận chữ giản thể, cách diễn đạt khác, từ đồng nghĩa nếu tự nhiên và đúng ý.
- "dung": đúng nghĩa, đúng ngữ pháp, có dùng từ bắt buộc (lỗi chữ nhỏ do gõ nhầm âm đồng âm thì vẫn ghi nhận nhưng chỉ ra).
- "gan_dung": hiểu được nhưng có lỗi nhỏ (trật tự từ, lượng từ, thiếu 了/的…, sai một chữ), hoặc đúng nghĩa nhưng không dùng từ bắt buộc.
- "sai": sai nghĩa, sai ngữ pháp nghiêm trọng, hoặc bỏ trống.
Chỉ trả về JSON: {"verdict":"dung|gan_dung|sai","fixed":"câu của học viên được sửa ít nhất có thể cho đúng, viết phồn thể (nếu đã đúng thì chép lại)","fixedPy":"pinyin của câu đã sửa","feedback":"1–3 câu tiếng Việt, chỉ rõ lỗi cụ thể và vì sao; nếu đúng thì khen ngắn và gợi ý cách nói tự nhiên hơn ở Đài Loan nếu có"}`;}
async function gradeAI(it,ans){
  const r=await sample.json(promptGrade(it,ans),{modelTier:'default'});
  const v={dung:'ok',gan_dung:'mid',sai:'bad'}[str(r&&r.verdict)];
  if(!v)throw {code:'bad'};
  return {v,fb:str(r.feedback),fixed:str(r.fixed),fixedPy:str(r.fixedPy)};
}
async function submitQuiz(){
  if(!qz||qz.phase!=='ask')return;
  const inp=$('#qzIn');const ans=(inp&&inp.value||'').trim();
  if(!ans){toast('Hãy gõ câu tiếng Trung của bạn trước nhé (hoặc bấm “Bỏ qua”).');return;}
  const it=qz.items[qz.i],me=qz;
  if(sample){
    qz.phase='grading';qz.cur={ans};render();
    let g;try{g=await gradeAI(it,ans);}catch(e){if(e&&e.code==='not_granted')aiErr(e);g=gradeLocal(it,ans);g.fb+=' (AI chưa chấm được nên đang so với đáp án mẫu.)';}
    if(qz!==me)return;
    qz.res[qz.i]={ans,...g};
  }else qz.res[qz.i]={ans,...gradeLocal(it,ans)};
  qz.phase='graded';render();
}
function skipQuiz(){if(!qz||qz.phase!=='ask')return;qz.res[qz.i]={ans:'',v:'bad',fb:'Bạn đã bỏ qua câu này.',skip:true};qz.phase='graded';render();}
function nextQuiz(){if(!qz)return;stopSpeech();qz.i++;qz.phase=qz.i>=qz.items.length?'done':'ask';render();window.scrollTo({top:0});}
const VERD={ok:['✓ Chính xác!','ok'],mid:['≈ Gần đúng','mid'],bad:['✗ Chưa đúng','bad']};
function renderQuiz(m){
  if(!qz)return renderQuizSetup(m);
  if(qz.phase==='done')return renderQuizSummary(m);
  const it=qz.items[qz.i],c=cards[it.id]||{w:'',py:'',vi:''},n=qz.items.length;
  const r=qz.res[qz.i],graded=qz.phase==='graded';
  const ok=qz.res.filter(x=>x&&x.v==='ok').length;
  const need=qzOpt.hint==='word'||graded?`<span>Dùng từ</span><b>${esc(hw(c))}</b><span>${esc(c.py)}</span>`
    :qzOpt.hint==='meaning'?`<span>Dùng từ có nghĩa: <b style="font:600 15px inherit;color:var(--ink)">${esc(c.vi)}</b></span><button class="btn sm ghost" id="qzHint">Gợi ý</button>`
    :`<button class="btn sm ghost" id="qzHint">Gợi ý từ cần dùng</button>`;
  let body='';
  if(qz.phase==='ask')body=`<textarea class="qz-in" id="qzIn" lang="zh-TW" rows="2" placeholder="Gõ câu tiếng Trung…" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <div class="mfoot" style="margin-top:12px"><button class="btn ghost" id="qzSkip">Bỏ qua</button><button class="btn primary" id="qzGo">Kiểm tra<span class="kbd">Enter</span></button></div>`;
  else if(qz.phase==='grading')body=`<div class="qz-in" style="opacity:.7">${esc(qz.cur.ans)}</div><div class="stk-info">✨ Đang chấm…</div>`;
  else{
    const [vt,vc]=VERD[r.v];
    let mine='';
    if(r.ans){const {keep}=lcsMark([...toSimp(r.ans)].join(''),toSimp(it.zh));
      const chars=[...r.ans];mine=r.local&&chars.length===keep.length?chars.map((ch,i)=>keep[i]||/[\s\p{P}]/u.test(ch)?esc(ch):`<s>${esc(ch)}</s>`).join(''):esc(r.ans);}
    const fixed=r.fixed&&normZh(toSimp(r.fixed))!==normZh(toSimp(r.ans))?`<div class="qz-lbl">Câu của bạn sau khi sửa</div><div class="qz-ref"><div style="flex:1"><div class="zh">${esc(disp(r.fixed))}</div>${r.fixedPy?`<div class="pyl">${esc(r.fixedPy)}</div>`:''}</div>${spk(disp(r.fixed),'sm')}</div>`:'';
    body=`<div class="qz-res ${vc}"><div class="v">${vt}</div>${r.fb?`<div style="font-size:14px">${esc(r.fb)}</div>`:''}
      ${r.ans?`<div class="qz-lbl">Bạn viết</div><div class="qz-ans">${mine}</div>`:''}${fixed}</div>
      <div class="qz-lbl" style="margin-top:14px">Đáp án mẫu</div>
      <div class="qz-ref" style="margin-top:4px"><div style="flex:1"><div class="zh">${hl(disp(it.zh),hw(c))}</div>${it.py?`<div class="pyl">${esc(it.py)}</div>`:''}</div>${spk(disp(it.zh),'sm')}</div>
      <div class="mfoot" style="margin-top:16px">${r.local&&r.v!=='ok'&&!r.skip?`<button class="btn ghost" id="qzOverride">Câu mình cũng đúng</button>`:''}<button class="btn ghost" data-open="${esc(it.id)}">Xem thẻ từ</button><button class="btn primary" id="qzNext">${qz.i+1<n?'Câu tiếp':'Xem kết quả'}<span class="kbd">Enter</span></button></div>`;
  }
  m.innerHTML=`<div class="qz-top"><span>Câu ${qz.i+1}/${n}${it.ai?' · ✨ câu mới':''}</span><span>✓ ${ok} đúng · <a href="#" id="qzQuit" style="color:var(--ink2)">Dừng</a></span></div>
  <div class="qz-bar"><i style="width:${(qz.i+(graded?1:0))/n*100}%"></i></div>
  <div class="card"><span class="badge b-new">Dịch sang tiếng Trung</span>
  <div class="qz-vi">${esc(it.vi)}</div><div class="qz-need" id="qzNeed">${need}</div>${body}</div>`;
  $('#qzQuit').onclick=async e=>{e.preventDefault();if(qz.res.length&&!await confirmBox('Dừng bài kiểm tra này?','Dừng'))return;qz.phase='done';qz.items=qz.items.slice(0,qz.res.filter(Boolean).length);if(!qz.items.length)qz=null;render();};
  const h=$('#qzHint');if(h)h.onclick=()=>{$('#qzNeed').innerHTML=`<span>Dùng từ</span><b>${esc(hw(c))}</b><span>${esc(c.py)}</span>`;$('#qzIn')&&$('#qzIn').focus();};
  const inp=$('#qzIn');
  if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();submitQuiz();}});
    $('#qzGo').onclick=submitQuiz;$('#qzSkip').onclick=skipQuiz;}
  const nx=$('#qzNext');if(nx){nx.onclick=nextQuiz;nx.focus({preventScroll:true});}
  const ov=$('#qzOverride');if(ov)ov.onclick=()=>{r.v='ok';r.fb='Bạn tự đánh giá là đúng.';render();};
  if(graded&&settings.autoplay)setTimeout(()=>qz&&qz.phase==='graded'&&speak(disp(it.zh)),200);
}
function renderQuizSetup(m){
  const pool=qzPool(),withEx=pool.filter(c=>sentencesOf(c).length).length;
  const seg=(k,opts)=>`<div class="seg">${opts.map(([v,t])=>`<button class="chipb ${String(qzOpt[k])===String(v)?'on':''}" data-qz="${k}|${v}">${t}</button>`).join('')}</div>`;
  m.innerHTML=`<div class="panel"><h2>📝 Dịch câu Việt → Trung</h2><p class="sub">Đọc câu tiếng Việt rồi gõ câu tiếng Trung có dùng từ đang học. ${sample?'AI sẽ chấm theo nghĩa, chỉ lỗi và sửa câu cho bạn.':'Chưa bật AI nên app sẽ so với đáp án mẫu; thêm Gemini key trong Cài đặt để được chấm theo nghĩa.'}</p>
    <label class="f">Lấy từ nào</label>${seg('src',[['learned','Từ đã học'],['hard','Từ hay quên'],['all','Tất cả từ'],['pick','☑ Tự chọn từ']])}
    ${qzOpt.src==='pick'?`<div style="margin-top:8px"><button class="btn sm" id="qzPick">☑ Chọn từ muốn kiểm tra (${pool.length})</button></div>${pool.length?`<div class="hvline" style="justify-content:flex-start;margin:8px 0 0">${pool.slice(0,24).map(c=>`<span><b class="zh">${esc(hw(c))}</b></span>`).join('')}${pool.length>24?`<i>+${pool.length-24}</i>`:''}</div>`:''}`:''}
    <div class="hint">${pool.length} từ${qzOpt.gen==='ex'?` · ${withEx} từ có câu ví dụ`:''}</div>
    <label class="f">Số câu</label>${seg('n',[[5,'5'],[10,'10'],[20,'20']])}
    <label class="f">Nguồn câu</label>${seg('gen',[['ex','Câu ví dụ trong thẻ'],...(sample?[['ai','✨ Câu mới do AI viết']]:[])])}
    <div class="hint">${qzOpt.gen==='ai'&&sample?'Mỗi lần một bộ câu mới, không trùng câu ví dụ nên không thể học thuộc.':'Dùng câu ví dụ và câu hội thoại có chứa từ.'}</div>
    <label class="f">Gợi ý</label>${seg('hint',[['word','Hiện từ cần dùng'],['meaning','Chỉ hiện nghĩa'],['none','Không gợi ý']])}
    <div class="mfoot"><button class="btn primary" id="qzStart">Bắt đầu</button></div></div>
    <div class="hint" style="text-align:center">Mẹo: bật bộ gõ tiếng Trung (Zhuyin hoặc Pinyin) trên máy. Enter để nộp, Shift+Enter để xuống dòng.</div>`;
  if(qzOpt.gen==='ai'&&!sample)qzOpt.gen='ex';
  $$('[data-qz]').forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.qz.split('|');qzOpt[k]=k==='n'?+v:v;saveQzOpt();render();});
  $('#qzStart').onclick=()=>startQuiz();
  const pk=$('#qzPick');if(pk)pk.onclick=openQuizPicker;
}
function openQuizPicker(){
  const sel=new Set((qzOpt.pick||[]).filter(id=>cards[id]));let q='',f='all';
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const shown=()=>{const k=norm(q);let l=Object.values(cards).filter(c=>!k||[c.w,c.s,c.py,c.vi,c.hv].some(x=>norm(x).includes(k)));
    if(f==='learned')l=l.filter(c=>!isNew(c));else if(f==='new')l=l.filter(isNew);else if(f==='sel')l=l.filter(c=>sel.has(c.id));
    return l.sort((a,b)=>a.ord-b.ord);};
  openModal(`<h2 style="margin:0 0 4px">☑ Chọn từ để kiểm tra</h2><p class="sub" style="color:var(--ink2);margin:0 0 10px">Đã chọn <b id="pkN">0</b> từ</p>
  <div class="toolbar"><input id="pkQ" placeholder="Tìm chữ Hán, pinyin hoặc nghĩa…"><select id="pkF"><option value="all">Tất cả</option><option value="learned">Đã học</option><option value="new">Mới</option><option value="sel">Đang chọn</option></select></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><button class="btn sm" id="pkAll">Chọn hết danh sách</button><button class="btn sm ghost" id="pkNone">Bỏ chọn hết</button></div>
  <div class="list" id="pkList"></div>
  <div class="mfoot" style="position:sticky;bottom:0;background:var(--paper);padding:10px 0"><button class="btn primary" id="pkDone">Xong</button></div>`,true);
  const draw=()=>{const l=shown();$('#pkN').textContent=sel.size;
    $('#pkList').innerHTML=l.length?l.map(c=>{const s=statusOf(c);return `<label class="row" style="cursor:pointer"><input type="checkbox" data-pk="${esc(c.id)}" ${sel.has(c.id)?'checked':''} style="width:20px;height:20px;accent-color:var(--red);flex:none"><div class="w zh">${esc(hw(c))}</div><div class="info"><div>${esc(c.py)}</div><div>${esc(c.vi)}</div></div><span class="chip ${s.cls}">${s.t}</span></label>`;}).join(''):'<div class="empty">Không có từ nào.</div>';
    $$('[data-pk]').forEach(x=>x.onchange=()=>{x.checked?sel.add(x.dataset.pk):sel.delete(x.dataset.pk);$('#pkN').textContent=sel.size;});};
  draw();
  $('#pkQ').oninput=e=>{q=e.target.value;draw();};
  $('#pkF').onchange=e=>{f=e.target.value;draw();};
  $('#pkAll').onclick=()=>{shown().forEach(c=>sel.add(c.id));draw();};
  $('#pkNone').onclick=()=>{sel.clear();draw();};
  const save=()=>{qzOpt.pick=[...sel];qzOpt.src='pick';saveQzOpt();};
  $('#pkDone').onclick=()=>{save();closeModal();};
  $('#mx').onclick=$('#mback').onclick=()=>{save();closeModal();};
  $('#mbg').onclick=e=>{if(e.target.id==='mbg'){save();closeModal();}};
}
function renderQuizSummary(m){
  const n=qz.items.length,res=qz.res;
  const ok=res.filter(r=>r&&r.v==='ok').length,mid=res.filter(r=>r&&r.v==='mid').length;
  const wrongIdx=qz.items.map((_,i)=>i).filter(i=>!res[i]||res[i].v!=='ok');
  const wrongIds=[...new Set(wrongIdx.map(i=>qz.items[i].id))].filter(id=>cards[id]);
  const pct=n?Math.round((ok+mid*.5)/n*100):0;
  m.innerHTML=`<div class="card"><div class="qz-sum"><div class="big" style="color:${pct>=80?'var(--jade)':pct>=50?'var(--amber)':'var(--red)'}">${pct>=80?'太棒了！':pct>=50?'不錯！':'加油！'}</div>
    <h2 style="margin:6px 0 2px">${ok}/${n} câu đúng${mid?` · ${mid} gần đúng`:''}</h2></div>
    <div class="qz-list">${qz.items.map((it,i)=>{const r=res[i]||{v:'bad'};const c=cards[it.id]||{};return `<div><span class="ic">${r.v==='ok'?'✅':r.v==='mid'?'🟡':'❌'}</span><span style="flex:1"><span>${esc(it.vi)}</span><br><span class="zh" style="font-size:17px">${esc(disp(it.zh))}</span>${r.ans&&r.v!=='ok'?`<br><span style="color:var(--ink2)">Bạn: <span class="zh" style="font-size:16px">${esc(r.ans)}</span></span>`:''}</span><b class="zh" style="font-size:16px;color:var(--red)">${esc(hw(c))}</b></div>`;}).join('')}</div>
    <div class="mfoot" style="justify-content:center;margin-top:18px">
      ${wrongIdx.length?`<button class="btn" id="qzRetry">Làm lại ${wrongIdx.length} câu sai</button>`:''}
      ${wrongIds.length?`<button class="btn" id="qzReview">Đưa ${wrongIds.length} từ sai vào ôn hôm nay</button>`:''}
      <button class="btn primary" id="qzNew">Bài mới</button></div></div>`;
  const rt=$('#qzRetry');if(rt)rt.onclick=()=>startQuiz(shuffle(wrongIdx.map(i=>qz.items[i])));
  const rv=$('#qzReview');if(rv)rv.onclick=()=>{let k=0;const now=Date.now();for(const id of wrongIds){const c=cards[id];if(c.srs&&c.srs.state==='review'&&c.srs.due>now){c.srs.due=now;saveCard(c);k++;}}
    rv.disabled=true;rv.textContent='Đã thêm vào ôn tập';toast(k?`${k} từ sẽ xuất hiện trong tab Học hôm nay.`:'Các từ này đã có trong lượt học hôm nay rồi.',3500);};
  $('#qzNew').onclick=()=>{qz=null;render();};
}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const say=e.target.closest('[data-say]');if(say){e.stopPropagation();speak(say.dataset.say,say);return;}
  const pl=e.target.closest('[data-play]');if(pl){const [id,i]=pl.dataset.play.split('|');const c=cards[id];if(c&&c.dlgs[+i])playDialogue(c.dlgs[+i],pl);return;}
  const dr=e.target.closest('[data-draw]');if(dr){aiDraw(dr.dataset.draw,dr);return;}
  const ph=e.target.closest('[data-photo]');if(ph){pickPhoto(ph.dataset.photo);return;}
  const ui=e.target.closest('[data-unimg]');if(ui){const c=cards[ui.dataset.unimg];if(c){delete c.img;saveCard(c);refreshCardView(c.id);}return;}
  const st=e.target.closest('[data-stroke]');if(st){e.stopPropagation();openStroke(st.dataset.strokeword||st.dataset.stroke,st.dataset.stroke);return;}
  const ac=e.target.closest('[data-aichars]');if(ac){aiChars(ac.dataset.aichars,ac);return;}
  const ai=e.target.closest('[data-aimore]');if(ai){aiMore(ai.dataset.aimore,ai);return;}
  const op=e.target.closest('[data-open]');if(op){openCard(op.dataset.open);return;}
  const bl=e.target.closest('.vil.blur');if(bl){bl.classList.toggle('show');return;}
  const nv=e.target.closest('[data-view],[data-goto]');if(nv){go(nv.dataset.view||nv.dataset.goto);return;}
});
function go(v){stopSpeech();view=v;try{history.replaceState(null,'','#'+v);}catch(e){}render();window.scrollTo({top:0});}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['hoc','tu-vung','kiem-tra','them','cai-dat'].includes(h)&&h!==view){view=h;render();}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#layerRoot').innerHTML){closeLayer();return;}if($('#modalRoot').innerHTML){closeModal();return;}}
  if(view!=='hoc'||$('#modalRoot').innerHTML||$('#layerRoot').innerHTML||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  if(e.code==='Space'||e.key==='Enter'){e.preventDefault();if(!revealed)reveal();else answer(3);}
  else if(revealed&&['1','2','3','4'].includes(e.key))answer(+e.key);
  else if(e.key==='r'||e.key==='R'){if(cur)speak(hw(cards[cur]));}
});

/* ============ START ============ */
$('#photoIn').onchange=e=>onPhoto(e.target.files&&e.target.files[0]);
loadLocal();migrate();ensureDay();rebuild();
{const h=location.hash.slice(1);if(['hoc','tu-vung','kiem-tra','them','cai-dat'].includes(h))view=h;}
loadOpenCC();
render();
initCloud();
if(window.claude&&window.claude.use){
  claude.use('sample').then(s=>{claudeSample=s||null;refreshAI();if(sample&&view!=='hoc')render();else if(sample&&revealed)render();}).catch(()=>{});
  claude.use('tts').then(t=>{ttsCap=t||null;if(view==='cai-dat')renderSettingsVoices();}).catch(()=>{});
}
</script>
